name: Atlas
options:
  bundleIdPrefix: com.jiayanl
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Pow:
    url: https://github.com/EmergeTools/Pow
    from: 1.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO

targets:
  Atlas:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Atlas
        excludes:
          - "Resources/SampleMeals/.keep"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiayanl.atlas
        PRODUCT_NAME: Atlas
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Atlas/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Atlas
        CODE_SIGN_ENTITLEMENTS: Atlas/Resources/Atlas.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        DEVELOPMENT_TEAM: ""
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: Pow
        product: Pow

  AtlasTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AtlasTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiayanl.atlas.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Atlas.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Atlas"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Atlas

  AtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AtlasUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiayanl.atlas.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Atlas
    dependencies:
      - target: Atlas

schemes:
  Atlas:
    build:
      targets:
        Atlas: all
        AtlasTests: [test]
        AtlasUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - AtlasTests
        - AtlasUITests
    archive:
      config: Release
