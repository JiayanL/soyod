name: iOS CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Install XcodeGen
        run: brew install xcodegen || true

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Atlas.xcodeproj -scheme Atlas \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            build | xcpretty || xcodebuild -project Atlas.xcodeproj -scheme Atlas \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' build

      - name: Unit tests
        run: |
          xcodebuild -project Atlas.xcodeproj -scheme Atlas \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:AtlasTests test
